name: Fetch benchmark results (temporary)

on:
  push:
    branches: [void-reorders]

permissions:
  contents: write
  actions: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the benchmark artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 42516186005 -n benchmarks -D fetched
      - name: Draw charts and tables
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet matplotlib
          mkdir -p Benchmarks/Fetched
          cp fetched/results.json Benchmarks/Fetched/results.json
          .venv/bin/python Benchmarks/Scripts/charts.py fetched/results.json Benchmarks/Fetched/charts
          python3 Benchmarks/Scripts/tables.py fetched/results.json > Benchmarks/Fetched/tables.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Benchmarks/Fetched
          git commit -m "Fetched benchmark results (temporary)"
          git push
