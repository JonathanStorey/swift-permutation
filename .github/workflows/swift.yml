name: Swift

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Run the fun facts
        working-directory: Examples
        run: swift run -c release FunFacts

  docs:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build symbol graphs
        run: |
          mkdir -p .build/symbol-graphs
          swift build --target Permutation -Xswiftc -emit-symbol-graph -Xswiftc -emit-symbol-graph-dir -Xswiftc .build/symbol-graphs
      - name: Build the documentation, failing on any unresolved link
        run: |
          xcrun docc convert Sources/Permutation/Permutation.docc \
            --fallback-display-name Permutation \
            --fallback-bundle-identifier io.github.jonathanstorey.permutation \
            --additional-symbol-graph-dir .build/symbol-graphs \
            --output-path .build/docs \
            --warnings-as-errors

  comparisons:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the comparisons
        working-directory: Benchmarks
        run: swift run -c release PermutationComparisons
      - name: Check how a bare Permutation link resolves
        run: |
          mkdir -p .build/symbol-graphs
          swift build --target Permutation -Xswiftc -emit-symbol-graph -Xswiftc -emit-symbol-graph-dir -Xswiftc .build/symbol-graphs
          printf '\nProbe: ``Permutation`` and ``Permutation/Permutation``.\n' >> Sources/Permutation/Permutation.docc/Arrangement.md
          printf '\nProbe: ``Permutation`` and ``Permutation/Permutation``.\n' >> Sources/Permutation/Permutation.docc/Documentation.md
          xcrun docc convert Sources/Permutation/Permutation.docc --fallback-display-name Permutation --fallback-bundle-identifier io.github.jonathanstorey.permutation --additional-symbol-graph-dir .build/symbol-graphs --output-path .build/probe 2>&1 | tail -20
          for f in .build/probe/data/documentation/permutation.json .build/probe/data/documentation/permutation/arrangement.json; do echo "$f"; python3 -c "import json;d=json.load(open('$f'));print([k for k in d['references'] if k.rstrip('/').lower().endswith('/permutation') or k.lower().endswith('/permutation/permutation')])"; grep -o 'Probe: [^}]*' "$f" | head -2; python3 -c "
import json;d=json.load(open('$f'))
def walk(x):
    if isinstance(x,dict):
        if x.get('type')=='paragraph' and any(i.get('text','').startswith('Probe') for i in x.get('inlineContent',[]) if isinstance(i,dict)): print(x['inlineContent'])
        for v in x.values(): walk(v)
    elif isinstance(x,list):
        for v in x: walk(v)
walk(d)"; done
