name: Swift

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Run the fun facts
        working-directory: Examples
        run: swift run -c release FunFacts

  docs:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build symbol graphs
        run: |
          mkdir -p .build/symbol-graphs
          swift build --target Permutation -Xswiftc -emit-symbol-graph -Xswiftc -emit-symbol-graph-dir -Xswiftc .build/symbol-graphs
      - name: Build the documentation, failing on any unresolved link
        run: |
          xcrun docc convert Sources/Permutation/Permutation.docc \
            --fallback-display-name Permutation \
            --fallback-bundle-identifier io.github.jonathanstorey.permutation \
            --additional-symbol-graph-dir .build/symbol-graphs \
            --output-path .build/docs \
            --warnings-as-errors
      - name: Debug overloads
        if: always()
        run: |
          xcrun docc convert Sources/Permutation/Permutation.docc --fallback-display-name Permutation --fallback-bundle-identifier io.github.jonathanstorey.permutation --additional-symbol-graph-dir .build/symbol-graphs --output-path .build/docs2 || true
          cd .build/docs2/data/documentation/permutation
          for f in $(ls -d */update\(or* */applying* | tr '\n' ' '); do echo "$f :: $(python3 -c "import json,sys;d=json.load(open('$f'));print(d['metadata'].get('roleHeading'),'|',' '.join(x.get('text','') for x in d.get('abstract',[]))[:90],'|',d.get('metadata',{}).get('extendedModule'),'|',[s.get('title') for s in d.get('relationshipsSections',[])])")"; done
