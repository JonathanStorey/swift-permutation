name: Swift

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Benchmark
        working-directory: Benchmarks
        run: |
          swift build -c release
          swift run -c release PermutationBenchmarks run results.json --cycles 3 --max-size 256k
          mkdir -p charts
          swift run -c release PermutationBenchmarks render results.json charts/identified-set-membership.png --filter 'init|append|contains|subscript|iteration|replace|update|remove'
          swift run -c release PermutationBenchmarks render results.json charts/identified-set-reordering.png --filter 'IdentifiedSet.*(reverse|shuffle|sort|rotate|apply)'
          swift run -c release PermutationBenchmarks render results.json charts/permutation.png --filter '^Permutation|\[Int\]|move\(fromOffsets'
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: |
            Benchmarks/results.json
            Benchmarks/charts
