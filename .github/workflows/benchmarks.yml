name: Benchmarks

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run
        working-directory: Benchmarks
        run: |
          swift build -c release
          swift run -c release PermutationBenchmarks run results.json --cycles 3 --max-size 256k --filter 'Dictionary'
      - name: Render charts
        working-directory: Benchmarks
        run: |
          mkdir -p charts
          swift run -c release PermutationBenchmarks render results.json charts/ordered-dictionary-membership.png --filter '^(PermutableDictionary|OrderedDictionary).*(init|insert|lookup|iteration|removeValue)'
          swift run -c release PermutationBenchmarks render results.json charts/ordered-dictionary-reordering.png --filter '^(PermutableDictionary|OrderedDictionary).*(sort|shuffle|reverse)'
      - name: Tables
        working-directory: Benchmarks
        run: python3 Scripts/tables.py results.json
      - name: Print (temporary)
        working-directory: Benchmarks
        run: |
          for f in charts/*.png; do echo "=====BEGIN $f"; base64 -i "$f"; echo "=====END $f"; done
          echo "=====BEGIN results"; gzip -c results.json | base64; echo "=====END results"
