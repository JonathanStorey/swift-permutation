name: Benchmarks

# Benchmarks take about half an hour, so they run only when started by hand from the Actions tab.
on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Run
        working-directory: Benchmarks
        run: |
          swift build -c release
          swift run -c release PermutationBenchmarks run results.json --cycles 3 --max-size 256k
      - name: Draw charts
        working-directory: Benchmarks
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet matplotlib
          .venv/bin/python Scripts/charts.py results.json charts
      - name: Write the comparison tables
        working-directory: Benchmarks
        run: python3 Scripts/tables.py results.json > tables.md && cat tables.md
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: |
            Benchmarks/results.json
            Benchmarks/tables.md
            Benchmarks/charts
